[workspace]
resolver = "2"
members = [
    "crates/bot-core",
    "crates/bot-service",
    "crates/game-core",
    "crates/game-rules",
    "crates/rules-cond",
    "crates/rules-native",
    "crates/rules-worker",
    "crates/server",
    "crates/web-glue",
]
# The guest side (cards compiled to wasm32) is a separate workspace: rules/
# It shares only the ABI crate (`rules/card-sdk`, constants + types, no imports
# on native).

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasmi = "2"
sha2 = "0.10"
card-sdk = { path = "rules/card-sdk" }
bitflags = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

# cel-rust fork: evaluate a pre-compiled CEL AST without the parser.
# See third_party/cel-rust/FORK.md and docs/GUARDS.md §8.
[patch.crates-io]
cel = { path = "third_party/cel-rust" }

[profile.dev]
debug = true
