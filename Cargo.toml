[workspace]
resolver = "2"
members = [
    "crates/bot-core",
    "crates/bot-glue",
    "crates/bot-service",
    "crates/card-sdk",
    "crates/game-core",
    "crates/game-kinds",
    "crates/game-rules",
    "crates/player-meta",
    "crates/spec-kit",
    "crates/cond",
    "crates/cond-ir",
    "rules/spec",
    "rules/tests",
    "crates/rules-native",
    "crates/rules-worker",
    "crates/server",
    "crates/web-glue",
    "rules/kani",
]
# The guest side (cards compiled to wasm32) is a separate workspace: rules/
# It depends on the kernel ABI crate (`crates/card-sdk`, constants + types, no
# imports on native) by path.

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
repository = ""

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# wasmi's default set enables `wat`, which pulls the WAT *text* parser (`wat` +
# `wast` + `wasm_encoder`) into every consumer. Card modules are binary only
# (`/assets/rules/*.wasm` -> `Module::new` on bytes) and the tree has no `.wat`
# fixtures, so that is dead weight in the browser glue -- roughly a tenth of the
# release wasm. Everything else is exactly wasmi's default feature set.
wasmi = { version = "2", default-features = false, features = ["stable", "std", "validate", "memory64", "auto-dispatch"] }
sha2 = "0.10"
card-sdk = { path = "crates/card-sdk" }
bitflags = { version = "2", default-features = false }

[profile.release]
opt-level = 3
lto = "thin"

# cel-rust fork: evaluate a pre-compiled CEL AST without the parser.
# See third_party/cel-rust/FORK.md and docs/GUARDS.md §8.
[patch.crates-io]
cel = { path = "third_party/cel-rust" }

[profile.dev]
debug = true

# The card ruleset is compiled by wasmi inside the browser engine at every
# match start. At opt-level 0 (with debug assertions and UB checks) translating
# the card module takes seconds under `npm run dev`; keep the interpreter and
# its wasm parser optimized in dev builds. Our own crates stay unoptimized, so
# debug assertions and the console cheats are unaffected. Release builds
# already use opt-level 3 for everything, so engine bundles do not change.
[profile.dev.package.wasmi]
opt-level = 3
[profile.dev.package.wasmi_core]
opt-level = 3
[profile.dev.package.wasmi_ir]
opt-level = 3
[profile.dev.package.wasmi_collections]
opt-level = 3
[profile.dev.package.wasmparser]
opt-level = 3
