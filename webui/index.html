    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <link rel="icon" href="/favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#ed4e76" />
    <!-- black-translucent: the home-screen PWA takes the whole screen in both
         orientations. The default style insets the webview below the status
         bar in portrait only (landscape hides the bar), so forced rotation
         laid out on a shorter canvas than a real turn of the phone and left
         the cutout band drawing nothing. -->
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BanG Dream 大富翁" />
