# `cargo test` only; release binaries are untouched.
#
# `rules-kani`'s differential tests build a ~1.3 MB model `World` by value and
# hold several copies live at once (debug frames do not reuse the slots). The
# libtest default 2 MiB thread stack overflows on `conf_model`'s op suite, so
# raise the floor for every test thread.
[env]
RUST_MIN_STACK = "67108864"
