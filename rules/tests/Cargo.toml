[package]
name = "ruleset-tests"
version.workspace = true
edition.workspace = true
publish = false
description = "Black-box rulebook tests for this game's shipped rules (cards, skills, tiles, events). Lives with the rule implementations under rules/. Engine-universal tests stay in crates/game-rules/tests/."

[dependencies]

[dev-dependencies]
game-core = { path = "../../crates/game-core" }
game-kinds = { path = "../../crates/game-kinds" }
bot-core = { path = "../../crates/bot-core" }
game-rules = { path = "../../crates/game-rules" }
card-sdk = { workspace = true }
bandori-std = { path = "../bandori-std" }
serde_json = { workspace = true }
rules-spec = { path = "../spec" }
spec-kit = { path = "../../crates/spec-kit" }
# `#[cfg(kani)]` items only exist for the proof harnesses; ordinary
# build/check/test compiles them out and check-cfg flags the name as unknown.
# Declare it so non-Kani builds stay quiet while real cfg typos still warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
