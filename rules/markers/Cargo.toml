[package]
name = "rules-markers"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Marker rules: one CardDef per mark:* category (kind-owned hosts), standing on the neutral board owner."

[lib]
# rlib: linked into the shipped module (card-all) like the band crates.
crate-type = ["rlib"]

[dependencies]
card-sdk = { path = "../card-sdk", features = ["guest"] }
ruleset-core = { path = "../ruleset-core" }
