[package]
name = "skill-groups"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Band skills as card rules (one file per skill) -- kept apart from the regular cards on purpose."

[lib]
crate-type = ["rlib"]

[dependencies]
card-sdk = { workspace = true, features = ["guest"] }
bandori-std = { workspace = true }
rules-status = { workspace = true }
rules-markers = { workspace = true }
