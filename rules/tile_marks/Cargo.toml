[package]
name = "rules-tile-marks"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Tile-mark rules: one CardDef per mark:* category, standing on the neutral board owner."

[lib]
# rlib: linked into the shipped module (card-all) like the band crates.
crate-type = ["rlib"]

[dependencies]
card-sdk = { path = "../card-sdk", features = ["guest"] }
