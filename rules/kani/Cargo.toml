[package]
name = "rules-kani"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Kani formal-verification foundation: general symbolic host + registry + harness kit over unmodified card bodies."
publish = false

# Host-only. Lives under rules/ for discoverability but is a ROOT workspace
# member and is deliberately NOT listed in rules/Cargo.toml (the wasm guest
# workspace). Run proofs from the repo root: `cargo kani -p rules-kani`.

[features]
# Diagnostic bisect harnesses that FAIL BY DESIGN (kassert!(false) probes) are
# only compiled as proofs with this feature, so a unit pass never reports them.
diag-probes = []
# Default = every band/skill/event/tile so conformance tests and other
# tools see the full RULESET. A unit run (`tools/kani/run.sh --unit pp`)
# enables only that unit's crates so CBMC's function-pointer removal sees
# a much smaller address-taken `fn(i32)->Asked` set (the 874-target IF-chain).
default = ["all"]
all = [
    "band-ag", "band-crychic", "band-general", "band-hhw", "band-morfonica",
    "band-mujica", "band-mygo", "band-pp", "band-ppp", "band-ras",
    "band-roselia", "band-sumimi",
    "skills-groups", "skills-personas",
    "tiles", "events",
]
band-ag = ["dep:card-ag"]
band-crychic = ["dep:card-crychic"]
band-general = ["dep:card-general"]
band-hhw = ["dep:card-hhw"]
band-morfonica = ["dep:card-morfonica"]
band-mujica = ["dep:card-mujica"]
# kani-bump (TUNING §11): static bump GlobalAlloc so unmodified bodies' Vec /
# String grow/drop is array arithmetic (kills RawVec OOM paths). Opt-in per
# unit that needs it; validated on known-green proofs before the unit flips.
# Forwarding is via this named feature (`card-sdk/kani-bump` alone does not
# show up in `cargo tree -e features` on this workspace).
kani-bump = ["card-sdk/kani-bump"]
band-mygo = ["dep:card-mygo", "kani-bump"]
band-pp = ["dep:card-pp"]
band-ppp = ["dep:card-ppp"]
band-ras = ["dep:card-ras", "kani-bump"]
band-roselia = ["dep:card-roselia"]
band-sumimi = ["dep:card-sumimi"]
skills-groups = ["dep:skill-groups"]
skills-personas = ["dep:skill-personas"]
tiles = ["dep:rules-tiles", "dep:rules-tile-marks"]
events = ["dep:rules-events"]

[dependencies]
card-sdk = { workspace = true, features = ["guest", "kani-bump"] }
ruleset-core = { path = "../ruleset-core" }
# Unmodified card / skill / event bodies under proof. Optional per unit
# (see [features]) so a single-unit kani build links only that unit's crates.
card-ag = { path = "../cards/card-ag", optional = true }
card-crychic = { path = "../cards/card-crychic", optional = true }
card-general = { path = "../cards/card-general", optional = true }
card-hhw = { path = "../cards/card-hhw", optional = true }
card-morfonica = { path = "../cards/card-morfonica", optional = true }
card-mujica = { path = "../cards/card-mujica", optional = true }
card-mygo = { path = "../cards/card-mygo", optional = true }
card-pp = { path = "../cards/card-pp", optional = true }
card-ppp = { path = "../cards/card-ppp", optional = true }
card-ras = { path = "../cards/card-ras", optional = true }
card-roselia = { path = "../cards/card-roselia", optional = true }
card-sumimi = { path = "../cards/card-sumimi", optional = true }
skill-groups = { path = "../skills/skill-groups", optional = true }
skill-personas = { path = "../skills/skill-personas", optional = true }
rules-tiles = { path = "../tiles", optional = true }
rules-tile-marks = { path = "../tile_marks", optional = true }
rules-events = { path = "../events", optional = true }
# Single-source guard IR (heap-free; the translator output).
rules-cond-ir = { path = "../cond-ir" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
serde = { workspace = true }

# Conformance tests (`tests/conf_model.rs`): thin adapter over the real host
# (`game_rules::hostfns`) so the symbolic model can be diffed against it.
# `native_shims` supplies the `ruleset_*` symbols card bodies link against on
# native, so `invoke::play` runs unmodified guest code against either backend.
# `build.rs` generates the guard IR table (`generated::cond_irs`) from the guard
# condition strings on every build; it is never committed.
[build-dependencies]
rules-cond = { path = "../cond", features = ["lower"] }

[dev-dependencies]
game-rules = { path = "../../crates/game-rules" }
game-core = { path = "../../crates/game-core" }
# `lower_src` for the status-fn fill differential (conf_fill_diff).
rules-cond = { path = "../cond", features = ["lower"] }

# The `kani` crate is injected by `cargo kani` / kani-compiler from the Kani
# sysroot (`~/.kani/kani-<ver>/lib/libkani.rlib`). It is NOT the crates.io
# placeholder `kani = 0.0.1`. Do not add a crates.io dependency.

[package.metadata.kani]
# Unwinding: card bodies use bounded Vec loops (discard pick, player_count<=4).
# Default 80 + --no-unwinding-checks (see tools/kani/run.sh and KANI.md §5).