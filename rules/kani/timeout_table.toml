# Per-harness wall-clock budget (seconds).
#
# For harness bodies that are over the 900 s default by **symex volume**, not
# by a wrong unwind: the message model copies card ids through UTF-8
# validation loops once per `Msg::card` / option push, so each such loop costs
# its length in unrolled steps times every path that reaches it. These bodies
# are already on the slimmest world that still exercises the clause (answers
# concrete, forced single-option asks); they just need the wall time.
#
# Consumed by tools/kani/run.sh: an explicit --timeout wins over the table.
# Format: `harness_name = seconds` under [timeout]. Key is the bare fn name
# (the runner's --harness filter), not the module path.

[timeout]
# Fire kernel (MARKERS-KANI-01): `bandori_std::fire::{gain,spend}` on the
# symbolic world. The no-op smoke measured 496 s; the body-bearing iff
# harnesses timed out the 900 s default in symex (643 s symex on the old
# 7×8×8 grid) before the property checks. The grids are now slimmed; these
# budgets are the wall time the remaining slices need.
fire_gain_iff = 1800
fire_gain_window_debug = 1800
fire_gain_name_concrete_debug = 900
fire_gain_at_cap_noop = 1200
fire_spend_iff = 5400
fire_spend_short_refused = 5400
fire_i2_is_preserved_by_gain = 1800
fire_gain_mutant_uncapped_is_detected = 1200
fire_spend_mutant_underspend_is_detected = 5400

# mark:cp guards / body: the filter pack is heap-free now, so the allocator
# model no longer gates the guard; the guard harness measured ~414 s.
mark_cp_land_gain_iff = 2400
mark_cp_land_mutant_900 = 2400
mark_cp_land_mutant_wrong_seat = 2400
mark_cp_land_guard_rejects_without_tile_cp = 1200
mark_cp_land_tile_cp_visible_to_count_marks = 1200
mark_cp_land_guard_rejects_when_cancelled = 1200

