[package]
name = "card-all"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "The shipped ruleset: every band's cards in one wasm module."

# The only cdylib of the card set. The band crates are rlibs it links.
[lib]
crate-type = ["cdylib"]

[dependencies]
card-sdk = { path = "../../card-sdk", features = ["guest"] }
card-ag = { path = "../card-ag" }
card-crychic = { path = "../card-crychic" }
card-general = { path = "../card-general" }
card-hhw = { path = "../card-hhw" }
card-morfonica = { path = "../card-morfonica" }
card-mujica = { path = "../card-mujica" }
card-mygo = { path = "../card-mygo" }
card-pp = { path = "../card-pp" }
card-ppp = { path = "../card-ppp" }
card-ras = { path = "../card-ras" }
card-roselia = { path = "../card-roselia" }
card-sumimi = { path = "../card-sumimi" }
skill-bands = { path = "../../skills/skill-bands" }
skill-characters = { path = "../../skills/skill-characters" }
rules-tiles = { path = "../../tiles" }
rules-tile-marks = { path = "../../tile_marks" }
rules-events = { path = "../../events" }

