[package]
name = "card-pp"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official pp cards (one crate per band, one file per card)."

[lib]
# rlib: these are libraries the shipped module (card-all) links.
crate-type = ["rlib"]

[dependencies]
card-sdk = { workspace = true, features = ["guest"] }
bandori-std = { workspace = true }
rules-status = { workspace = true }
skill-groups = { workspace = true }
