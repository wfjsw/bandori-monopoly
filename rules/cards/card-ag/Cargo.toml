[package]
name = "card-ag"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Official ag cards (one crate per band, one file per card)."

[lib]
# rlib: these are libraries the shipped module (card-all) links.
crate-type = ["rlib"]

[dependencies]
card-sdk = { path = "../../../crates/card-sdk", features = ["guest"] }
bandori-std = { path = "../../bandori-std" }
rules-status = { path = "../../status" }
# ActivationArg's bounds (docs/ACTIVATION.md §2): a card's own activation
# struct is a postcard record, so it derives Serialize/Deserialize.
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
