[package]
name = "fixture-test-cards"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Test-only cards. Not shipped. Also proves a module may hold several cards."

[lib]
crate-type = ["cdylib"]

[dependencies]
card-sdk = { path = "../../card-sdk", features = ["guest"] }
bandori-std = { path = "../../bandori-std" }
rules-status = { path = "../../status" }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
