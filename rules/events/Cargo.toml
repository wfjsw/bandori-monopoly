[package]
name = "rules-events"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Event card (事件卡) rules: one CardDef per event, active on the neutral board owner."

[lib]
# rlib: linked into the shipped module (card-all) like the band crates.
crate-type = ["rlib"]

[dependencies]
card-sdk = { path = "../card-sdk", features = ["guest"] }
bandori-std = { path = "../bandori-std" }
rules-status = { path = "../status" }
# `event:协助CiRCLE重建` re-homes 「CiRCLE原本的所有效果」 onto the cafe --
# the [经过] reward body lives in `rules-tiles` (`tile:circle::settle_reward`)
# so both call sites share one implementation.
rules-tiles = { path = "../tiles" }