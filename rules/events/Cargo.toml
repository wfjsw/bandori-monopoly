[package]
name = "rules-events"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Event card (事件卡) rules: one CardDef per event, active on the neutral board owner."

[lib]
# rlib: linked into the shipped module (card-all) like the band crates.
crate-type = ["rlib"]

[dependencies]
card-sdk = { workspace = true, features = ["guest"] }
bandori-std = { workspace = true }
rules-status = { workspace = true }
# `#[cfg(kani)]` items only exist for the proof harnesses; ordinary
# build/check/test compiles them out and check-cfg flags the name as unknown.
# Declare it so non-Kani builds stay quiet while real cfg typos still warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
