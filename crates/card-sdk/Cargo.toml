[package]
name = "card-sdk"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Card authoring SDK + host/guest ABI for the BandoriMonopoly WASM ruleset."

# Used from two places:
#  * the rules/ guest card crates (wasm32) -> constants + `ctx` host imports + `ruleset!`
#  * crates/game-rules (host, native and wasm32) -> constants only (`abi`)
[dependencies]
game-kinds = { path = "../game-kinds" }

serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# no_std: flags type for the t.Move bitset (default features off).
bitflags = { version = "2", default-features = false }

[features]
# Guest builds (no_std cdylibs): panic handler + bump allocator. Enable it in
# the card crate AND put `#![cfg_attr(target_arch = "wasm32", no_std)]` there too.
guest = []
# Third cfg: "wasm32 target, linked guest" (the bot monolith, `bot-glue` +
# `rules-native`). `sys.rs` drops `wasm_import_module = "ruleset"` and keeps
# the `link_name = "ruleset_*"` renames so wasm-ld resolves them to
# `game-rules`'s `native_shims` inside the one module. Also disables the guest
# panic handler / bump allocator (the monolith is a std cdylib) and keeps the
# buffer arena (the host is `NativeHost`, which always reads the arena).
# No new deps. See docs/BOT.md §3.6.
native-rules = []
# cfg(kani) only: static bump GlobalAlloc (experimental, see kani_alloc.rs).
kani-bump = []
