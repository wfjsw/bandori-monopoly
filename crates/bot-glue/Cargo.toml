[package]
name = "bot-glue"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Browser worker bundle for the advanced (ISMCTS) bot (docs/BOT.md B6): bot-core + game-core + game-rules (wasmi) exposed to a Web Worker. One seat's view in, a proposed answer out. The main page glue (web-glue) stays unchanged."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
bot-core = { path = "../bot-core" }
game-core = { path = "../game-core" }
game-rules = { path = "../game-rules" }
serde = { workspace = true }
serde_json = { workspace = true }
# Must match the wasm-bindgen CLI exactly (tools/build-bot-glue.mjs).
wasm-bindgen = "=0.2.129"

# Same allocator note as web-glue: the worker is long-lived and the search
# allocates on every iteration. Pinned -- see web-glue's Cargo.toml.
[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.1.1"
js-sys = "0.3"