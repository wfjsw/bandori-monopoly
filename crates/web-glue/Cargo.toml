[package]
name = "web-glue"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen bridge: game-core for the browser (solo engine, deck rules, profile)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game-core = { path = "../game-core" }
game-rules = { path = "../game-rules" }
serde = { workspace = true }
serde_json = { workspace = true }
# Must match the wasm-bindgen CLI exactly (tools/build-glue.mjs).
wasm-bindgen = "=0.2.129"
