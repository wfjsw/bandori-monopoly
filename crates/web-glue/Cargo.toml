[package]
name = "web-glue"
version.workspace = true
edition.workspace = true
description = "wasm-bindgen bridge: game-core for the browser (solo engine, deck rules, profile)."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
game-core = { path = "../game-core" }
game-rules = { path = "../game-rules" }
serde = { workspace = true }
serde_json = { workspace = true }
# Must match the wasm-bindgen CLI exactly (tools/build-glue.mjs).
wasm-bindgen = "=0.2.129"

# The long-lived engine allocates on every tick; wasm32 defaults to dlmalloc.
# Pinned: the global-allocator surface changed in 5.x (see the note on the
# `ALLOC` static in lib.rs) and an unbounded upgrade would silently break it.
[target.'cfg(target_arch = "wasm32")'.dependencies]
talc = "=5.1.1"
