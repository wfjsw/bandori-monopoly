[package]
name = "rules-cond-ir"
version.workspace = true
edition.workspace = true
license = "MIT"
description = "Heap-free condition IR + interpreter + reference semantics for Kani (docs/rulebook/spec/COND-SINGLE-SOURCE.md). Host-only; never linked into wasm."
publish = false

[lib]
crate-type = ["rlib"]

[dependencies]
# `#[cfg(kani)]` items only exist for the proof harnesses; ordinary
# build/check/test compiles them out and check-cfg flags the name as unknown.
# Declare it so non-Kani builds stay quiet while real cfg typos still warn.
[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(kani)"] }
