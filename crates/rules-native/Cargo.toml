[package]
name = "rules-native"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The card ruleset linked as plain native Rust for the bot's simulations (docs/BOT.md B1). Advisory only -- the sandboxed WasmRules stays authoritative for real matches."

[dependencies]
game-core = { path = "../game-core" }
# Linked path: no sandbox / wasmi. The drift test re-enables `sandbox` through
# the dev-dependency below so it can compare against `WasmRules`.
game-rules = { path = "../game-rules", default-features = false, features = ["native-rules"] }
card-sdk = { workspace = true, features = ["guest", "native-rules"] }
bandori-std = { path = "../../rules/bandori-std" }
postcard = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { workspace = true }
# Ruleset binding: the shipped ruleset as an rlib (same crates the wasm module
# links). Crate/path names stay as the ruleset ships them; this list is the
# same one `card-all` aggregates for the wasm module -- kept explicit here so
# the native link does not depend on the cdylib's crate-type dance).
card-ag = { path = "../../rules/cards/card-ag" }
card-crychic = { path = "../../rules/cards/card-crychic" }
card-general = { path = "../../rules/cards/card-general" }
card-hhw = { path = "../../rules/cards/card-hhw" }
card-morfonica = { path = "../../rules/cards/card-morfonica" }
card-mujica = { path = "../../rules/cards/card-mujica" }
card-mygo = { path = "../../rules/cards/card-mygo" }
card-pp = { path = "../../rules/cards/card-pp" }
card-ppp = { path = "../../rules/cards/card-ppp" }
card-ras = { path = "../../rules/cards/card-ras" }
card-roselia = { path = "../../rules/cards/card-roselia" }
card-sumimi = { path = "../../rules/cards/card-sumimi" }
skill-groups = { path = "../../rules/skills/skill-groups" }
skill-personas = { path = "../../rules/skills/skill-personas" }
personas = { path = "../../rules/personas" }
rules-tiles = { path = "../../rules/tiles" }
rules-markers = { path = "../../rules/markers" }
rules-status = { path = "../../rules/status" }
rules-events = { path = "../../rules/events" }

[dev-dependencies]
# drift.rs compares the native backend against the sandboxed `WasmRules`, so
# the test build of `game-rules` turns `sandbox` (wasmi/wasmtime) back on.
game-rules = { path = "../game-rules", default-features = false, features = ["native-rules", "sandbox"] }
serde_json = { workspace = true }

[features]
# Measurement counters, same shape as game-rules' `bot-cost`.
bot-cost = ["game-rules/bot-cost"]