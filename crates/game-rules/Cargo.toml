[package]
name = "game-rules"
version.workspace = true
edition.workspace = true
description = "Host for the WASM card ruleset. The browser runs wasmi (interpreter); the server runs wasmtime (optimizing compiler). Deterministic replay on both."

[dependencies]
game-core = { path = "../game-core" }
game-kinds = { path = "../game-kinds" }
card-sdk = { workspace = true }
postcard = { version = "1", default-features = false, features = ["alloc"] }
# Optional: only the sandboxed card-module host (wasmi / wasmtime) needs an
# engine. `sandbox = ["dep:wasmi"]` keeps wasmi out of the bot monolith
# (`bot-glue` + `native-rules`) entirely -- not merely GC'd from the bundle.
wasmi = { workspace = true, optional = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Guard prefilter conditions (docs/GUARDS.md G0/G2). Host builds compile from
# source (the `cel` parser); the wasm32 (browser glue) build loads the lean
# compiled form with `runtime-only` and never ships the parser (§8.3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rules-cond = { path = "../../rules/cond" }
# wasmtime is the native sandbox backend. Optional so a `sandbox = false`
# build (`rules-native` / the bot monolith) does not compile an unused engine.
wasmtime = { version = "37", optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
rules-cond = { path = "../../rules/cond", default-features = false, features = ["runtime-only"] }

[features]
default = ["sandbox"]
# The sandboxed card-module host (wasmi on wasm32 / wasmi-native, wasmtime on
# native). Off for the linked path (`native-rules`): `rules-native` and the bot
# monolith share `HostCtx` / `RulesBridge` / `hostfns` and never name a wasm
# engine. On by default so `web-glue`, `server`, `rules-worker` and the
# `game-rules` tests are unchanged.
#
# `dep:wasmtime` is target-gated (native only); on wasm32 the feature pulls
# just wasmi.
sandbox = ["dep:wasmi", "dep:wasmtime"]
# Run the interpreter even natively (the tests then cover both backends).
wasmi-native = ["sandbox"]
# Measurement counters for docs/BOT.md §5 (B0). Off by default; zero
# behavioural difference -- a few `AtomicU64` bumps around each card run.
bot-cost = ["game-core/bot-cost"]
# Third cfg: wasm32 target with the card rules linked in as rlibs (the bot
# monolith). Enables `native_shims` on wasm32 so the `ruleset_*` externs in
# `card-sdk`'s `ctx/sys.rs` resolve inside the one module. Pure guest wasm
# modules (sandbox cards) leave this off and keep `wasm_import_module`.
native-rules = ["card-sdk/native-rules", "rules-cond/compile"]

[dev-dependencies]
# Ruleset-defined counter names and kind ids for tests that arrange fixtures.
bandori-std = { path = "../../rules/bandori-std" }