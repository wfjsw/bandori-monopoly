[package]
name = "game-rules"
version.workspace = true
edition.workspace = true
description = "Host for the WASM card ruleset. The browser runs wasmi (interpreter); the server runs wasmtime (optimizing compiler). Deterministic replay on both."

[dependencies]
game-core = { path = "../game-core" }
card-sdk = { workspace = true }
postcard = { version = "1", default-features = false, features = ["alloc"] }
wasmi = { workspace = true }
sha2 = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

# Guard prefilter conditions (docs/GUARDS.md G0/G2). Host builds compile from
# source (the `cel` parser); the wasm32 (browser glue) build loads the lean
# compiled form with `runtime-only` and never ships the parser (§8.3).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
rules-cond = { path = "../../rules/cond" }
wasmtime = "37"

[target.'cfg(target_arch = "wasm32")'.dependencies]
rules-cond = { path = "../../rules/cond", default-features = false, features = ["runtime-only"] }

[features]
# The sandboxed card-module host (wasmi / wasmtime) is the default and still a
# hard dep: splitting `host.rs`'s 5k-line `Ruleset` / `Linker` surface away from
# the shared types (`HostState`, `RulesHandle`, `CardModules`) is a large
# invasive change. The bot monolith (`native-rules`) links wasmi-but-unused and
# instead proves it has no `ruleset` wasm-import module (tools/check-bot-monolith.mjs).
# Deferred: optional `sandbox = ["dep:wasmi"]` once host.rs is split.
# Run the interpreter even natively (the tests then cover both backends).
wasmi-native = []
# Measurement counters for docs/BOT.md §5 (B0). Off by default; zero
# behavioural difference -- a few `AtomicU64` bumps around each card run.
bot-cost = ["game-core/bot-cost"]
# Third cfg: wasm32 target with the card rules linked in as rlibs (the bot
# monolith). Enables `native_shims` on wasm32 so the `ruleset_*` externs in
# `card-sdk`'s `ctx/sys.rs` resolve inside the one module. Pure guest wasm
# modules (sandbox cards) leave this off and keep `wasm_import_module`.
native-rules = ["card-sdk/native-rules", "rules-cond/compile"]

[dev-dependencies]
# Ruleset-defined counter names and kind ids for tests that arrange fixtures.
ruleset-core = { path = "../../rules/ruleset-core" }
